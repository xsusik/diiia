[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sign.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"

[[redirects]]
  from = "/api/*"
  to = "https://diia-bot-worker.YOUR-SUBDOMAIN.workers.dev/api/:splat"
  status = 200
  force = true

